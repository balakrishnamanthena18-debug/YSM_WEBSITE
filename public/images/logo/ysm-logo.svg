<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients / Shadow -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- YSM Geometric Origami Y Emblem -->
  <g transform="translate(20, 25)">
    <!-- Top-Left Wing -->
    <polygon points="0,15 95,78 60,118 0,15" fill="#00B2B6" />
    
    <!-- Top-Right Wing -->
    <polygon points="152,15 95,78 108,135 152,15" fill="#00B2B6" />
    
    <!-- Center Dark Teal Fold -->
    <polygon points="95,78 60,118 108,135" fill="#005A58" />
    
    <!-- Lower Stem / Bottom Facet -->
    <polygon points="60,118 108,135 78,168 46,145" fill="#38C6C3" />
    <polygon points="46,145 78,168 52,178" fill="#4DD6D3" />
  </g>

  <!-- Logotype Text: YSM INFOTECH -->
  <!-- Inline / Double-stroked serif styling -->
  <g fill="#071B1C" font-family="'Times New Roman', Times, 'Playfair Display', serif" font-style="italic" font-weight="bold">
    <text x="175" y="112" font-size="74" letter-spacing="3" text-anchor="start" stroke="#071B1C" stroke-width="1.5">YSM INFOTECH</text>
    <!-- Inner white inline highlight overlay for the signature engraved look -->
    <text x="175" y="112" font-size="74" letter-spacing="3" text-anchor="start" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85">YSM INFOTECH</text>
  </g>

  <!-- Subtitle: AN ISO 9001: 2015 CERTIFIED -->
  <text x="430" y="160" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18.5" font-weight="600" letter-spacing="3.5" fill="#071B1C" text-anchor="middle">
    AN ISO 9001: 2015 CERTIFIED
  </text>
</svg>
